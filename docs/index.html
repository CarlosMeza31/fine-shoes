<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fine Shoes — Catálogo</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👟</text></svg>">
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────────── -->
<nav class="navbar">
  <a href="index.html" class="navbar__logo">Fine Shoes</a>
  <ul class="navbar__links">
    <li><a href="index.html">Catálogo</a></li>
    <li><a href="#" id="nav-orders" style="display:none">Mis Pedidos</a></li>
    <li><a href="admin/dashboard.html" id="nav-admin" style="display:none">Admin</a></li>
  </ul>
  <div class="navbar__search">
    <input type="search" id="search-input" placeholder="Buscar sneakers...">
  </div>
  <div class="navbar__actions">
    <a href="cart.html" class="navbar__cart-btn">
      🛒 Carrito
      <span class="cart-badge" style="display:none">0</span>
    </a>
    <a href="login.html" id="nav-login" class="btn btn-outline btn-sm">Ingresar</a>
    <button id="nav-logout" class="btn btn-outline btn-sm" style="display:none">Salir</button>
  </div>
</nav>

<!-- ── Hero ───────────────────────────────────────────────── -->
<section class="hero" style="max-width:1280px">
  <h1 class="hero__title">Sneakers<br>que definen<br>tu estilo</h1>
  <p class="hero__sub">Explora las mejores marcas del mercado: Nike, Adidas, Jordan, New Balance y más.</p>
  <a href="#catalog" class="btn btn-primary">Ver catálogo</a>
</section>

<!-- ── Catálogo ───────────────────────────────────────────── -->
<section id="catalog" class="catalog-layout">

  <!-- Filtros -->
  <aside class="filters">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
      <p class="filters__title" style="margin:0">Filtros</p>
      <span id="active-filter-badge" style="display:none;
            font-size:.7rem;font-weight:700;background:var(--gold);
            color:#000;border-radius:999px;padding:.15rem .55rem">0</span>
    </div>

    <!-- Marca -->
    <div class="filter-group">
      <span class="filter-group__label">Marca</span>
      <div class="filter-chips" id="brand-chips">
        <span class="chip active" data-brand="">Todas</span>
        <!-- Se llenan dinámicamente desde /brands -->
      </div>
    </div>

    <!-- Talla (dinámicas desde /sizes) -->
    <div class="filter-group">
      <span class="filter-group__label">Talla</span>
      <div class="filter-chips" id="size-chips">
        <span class="chip active" data-size="">Todas</span>
        <!-- Se llenan dinámicamente desde /sizes -->
      </div>
    </div>

    <!-- Color (dinámico desde /colors) -->
    <div class="filter-group">
      <span class="filter-group__label">Color</span>
      <div class="filter-chips" id="color-chips">
        <span class="chip active" data-color="">Todos</span>
        <!-- Se llenan dinámicamente desde /colors -->
      </div>
    </div>

    <!-- Precio -->
    <div class="filter-group">
      <span class="filter-group__label">Precio (MXN)</span>
      <div style="display:flex;gap:.5rem;align-items:center">
        <input type="number" id="min-price" placeholder="Mín" min="0" style="width:100%;">
        <span style="color:var(--gray)">—</span>
        <input type="number" id="max-price" placeholder="Máx" min="0" style="width:100%;">
      </div>
    </div>

    <!-- Ordenar -->
    <div class="filter-group">
      <span class="filter-group__label">Ordenar por</span>
      <select id="sort-select" style="width:100%">
        <option value="newest">Más recientes</option>
        <option value="price_asc">Precio: menor a mayor</option>
        <option value="price_desc">Precio: mayor a menor</option>
        <option value="name_asc">Nombre A–Z</option>
      </select>
    </div>

    <button class="btn btn-outline" id="clear-filters" style="width:100%;margin-top:.5rem">
      Limpiar filtros
    </button>
  </aside>

  <!-- Grid de productos -->
  <div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
      <span class="section-title" id="results-count">Cargando...</span>
    </div>
    <div class="products-grid" id="products-grid">
      <div class="loading-state"><div class="spinner"></div></div>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>

</section>

<script type="module">
  import { products, brands, colors, sizes, isLoggedIn, isAdmin, logout,
           refreshCartBadge, showToast } from './js/api.js';

  // Estado completo de filtros
  const state = { brand: '', size: '', color: '', q: '', min_price: '', max_price: '', sort: 'newest', page: 1 };

  // ── Contador de filtros activos ─────────────────────────────────
  function updateFilterBadge() {
    const active = [state.brand, state.size, state.color, state.q,
                    state.min_price, state.max_price].filter(Boolean).length;
    const badge = document.getElementById('active-filter-badge');
    badge.textContent = active;
    badge.style.display = active ? 'inline-block' : 'none';
  }

  // ── Mostrar/ocultar nav según sesión ────────────────────────
  if (isLoggedIn()) {
    document.getElementById('nav-login').style.display = 'none';
    document.getElementById('nav-logout').style.display = '';
    document.getElementById('nav-orders').style.display = '';
    document.getElementById('nav-orders').href = 'orders.html';
  }
  if (isAdmin()) {
    document.getElementById('nav-admin').style.display = '';
  }
  document.getElementById('nav-logout')?.addEventListener('click', logout);
  refreshCartBadge();

  // ── Cargar marcas ─────────────────────────────────────────
  async function loadBrands() {
    const data = await brands.list();
    const container = document.getElementById('brand-chips');
    data.forEach(b => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.dataset.brand = b.slug;
      chip.textContent = b.name;
      container.appendChild(chip);
    });
  }

  // ── Cargar tallas dinámicamente desde /sizes ────────────────────
  async function loadSizes() {
    try {
      const data = await sizes.list();
      const container = document.getElementById('size-chips');
      data.forEach(s => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.dataset.size = s;
        chip.textContent = s;
        container.appendChild(chip);
      });
    } catch {
      const fallback = ['25','26','27','28','29'];
      const container = document.getElementById('size-chips');
      fallback.forEach(s => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.dataset.size = s;
        chip.textContent = s;
        container.appendChild(chip);
      });
    }
  }

  // ── Cargar colores dinámicamente desde /colors ─────────────────
  async function loadColors() {
    try {
      const data = await colors.list();
      const container = document.getElementById('color-chips');
      data.forEach(c => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.dataset.color = c;
        chip.textContent = c;
        container.appendChild(chip);
      });
    } catch { }
  }

  // ── Render de productos ────────────────────────────────────
  function renderProducts(list) {
    const grid = document.getElementById('products-grid');
    if (!list.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <div class="empty-state__icon">👟</div>
        <div class="empty-state__title">Sin resultados</div>
        <p>Intenta con otros filtros</p>
      </div>`;
      return;
    }

    grid.innerHTML = list.map(p => `
      <a href="product.html?id=${p.id}" class="product-card">
        <div class="product-card__img">
          <img src="${p.image_url || 'https://placehold.co/400x300/111/555?text=Shoe'}"
               alt="${p.name}" loading="lazy"
               onerror="this.src='https://placehold.co/400x300/111/555?text=Shoe'">
        </div>
        <div class="product-card__body">
          <p class="product-card__brand">${p.brand_name}</p>
          <p class="product-card__name">${p.name}</p>
          <p class="product-card__price">
            $${Number(p.price).toLocaleString('es-MX', {minimumFractionDigits:2})}
            <span>MXN</span>
          </p>
        </div>
      </a>
    `).join('');
  }

  // ── Paginación ───────────────────────────────────────────
  function renderPagination(pagination) {
    const container = document.getElementById('pagination');
    if (pagination.pages <= 1) { container.innerHTML = ''; return; }

    let html = '';
    for (let i = 1; i <= pagination.pages; i++) {
      html += `<button class="page-btn ${i === state.page ? 'active' : ''}"
                        onclick="setPage(${i})">${i}</button>`;
    }
    container.innerHTML = html;
  }

  // ── Fetch y actualizar UI ─────────────────────────────────
  async function loadProducts() {
    document.getElementById('products-grid').innerHTML =
      '<div class="loading-state"><div class="spinner"></div></div>';
    updateFilterBadge();
    try {
      const res = await products.list({ ...state });
      const count = document.getElementById('results-count');
      count.textContent = `${res.pagination.total} producto${res.pagination.total !== 1 ? 's' : ''}`;
      renderProducts(res.products);
      renderPagination(res.pagination);
    } catch (e) {
      showToast(e.message, 'error');
    }
  }

  window.setPage = (n) => { state.page = n; loadProducts(); };

  // ── Adjuntar listeners a chips ──────────────────
  function makeChipListener(containerId, stateKey) {
    document.querySelectorAll(`#${containerId} .chip`).forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll(`#${containerId} .chip`).forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        state[stateKey] = chip.dataset[stateKey] || '';
        state.page = 1;
        loadProducts();
      });
    });
  }

  // ── Búsqueda con debounce ─────────────────────────────────
  let searchTimer;
  document.getElementById('search-input').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.q = e.target.value.trim();
      state.page = 1;
      loadProducts();
    }, 400);
  });

  // ── Filtro de precio ────────────────────────────────────
  let priceTimer;
  ['min-price','max-price'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      clearTimeout(priceTimer);
      priceTimer = setTimeout(() => {
        state.min_price = document.getElementById('min-price').value;
        state.max_price = document.getElementById('max-price').value;
        state.page = 1;
        loadProducts();
      }, 600);
    });
  });

  // ── Sort ─────────────────────────────────────────────────
  document.getElementById('sort-select').addEventListener('change', e => {
    state.sort = e.target.value;
    state.page = 1;
    loadProducts();
  });

  // ── Limpiar filtros ────────────────────────────────────
  document.getElementById('clear-filters').addEventListener('click', () => {
    Object.assign(state, { brand:'', size:'', color:'', q:'', min_price:'', max_price:'', sort:'newest', page:1 });
    document.getElementById('search-input').value = '';
    document.getElementById('min-price').value = '';
    document.getElementById('max-price').value = '';
    document.getElementById('sort-select').value = 'newest';
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    document.querySelector('[data-brand=""]').classList.add('active');
    document.querySelector('[data-size=""]').classList.add('active');
    document.querySelector('[data-color=""]').classList.add('active');
    loadProducts();
  });

  // ── Inicializar: carga en paralelo, luego adjunta listeners ───────
  (async () => {
    await Promise.all([loadBrands(), loadSizes(), loadColors()]);
    // IMPORTANTE: adjuntar listeners DESPUÉS de que los chips
    // dinámicos (tallas y colores) existan en el DOM
    makeChipListener('brand-chips',  'brand');
    makeChipListener('size-chips',   'size');
    makeChipListener('color-chips',  'color');
    loadProducts();
  })();
</script>
</body>
</html>
